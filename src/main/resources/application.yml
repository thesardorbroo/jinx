logging:
  level:
    root: DEBUG
    uz.sardorbroo.jinx: DEBUG
    org.liquibase: DEBUG

server:
  port: 8080

nginx:
  home: ${NGINX_HOME}

spring:
  application:
    name: jinx
  liquibase:
    enabled: true
    change-log: classpath:config/db/master.xml
    url: mongodb://admin:admin@localhost:27017/jinx?authSource=admin
  # Uncomment if you want to enable MongoDB in your project
  data:
    mongodb:
      uri: mongodb://admin:admin@localhost:27017/jinx?authSource=admin

mongock:
  migration-scan-package:
    - uz.sardorbroo.jinx.config.changelog.mongock

application:
  directive-storage:
    impl: mongodb
    init: src/main/resources/config/db/init-data/nginx_directives.csv
  features:
    package-scan: true